<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연구업적 | 남길임</title>
<meta name="description" content="남길임 교수 연구업적 — 학술지 논문, 학술대회 발표, 저역서 목록.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="index.html">남길임 <span>Kilim Nam</span></a>
    <nav class="nav">
      <a href="index.html">소개</a>
      <a href="publications.html" aria-current="page">연구업적</a>
      <a href="projects.html">연구사업</a>
      <button class="theme-btn" type="button" aria-label="밝은 화면 / 어두운 화면 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main">
  <section class="hero hero--sub">
    <div class="wrap">
      <p class="eyebrow">Journals, Conferences & Books</p>
      <h1>학술지 · 학술대회 · 저역서</h1>
    </div>
  </section>

  <div class="filters">
    <div class="wrap">
      <div class="filters__row">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="제목 · 저자 · 학술지 · 학술대회 · 발행처 검색" autocomplete="off">
        </label>
        <select id="year" class="pill" aria-label="연도 선택"></select>
        <select id="type" class="pill" aria-label="갈래 구분">
          <option value="">전체 갈래</option>
          <option value="J">J — 학술지 (저널)</option>
          <option value="C">C — 학술대회 (컨퍼런스)</option>
          <option value="B">B — 저역서</option>
        </select>
        <select id="kind" class="pill" aria-label="국내·국외 구분">
          <option value="">국내 · 국외 전체</option>
          <option value="dom">국내</option>
          <option value="intl">국외</option>
        </select>
        <span class="count" id="count"></span>
        <button class="linkbtn" id="reset" type="button" hidden>필터 해제</button>
      </div>
      <div class="histo" id="histo" role="group" aria-label="연도별 논문 수"></div>
      <div class="histo-axis" id="histo-axis"></div>
    </div>
  </div>

  <section class="section section--list">
    <div class="wrap">
      <div id="pub-list"></div>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap foot-row">
    <span>&copy; 2026 남길임</span>
    <span class="right"><a href="index.html">홈으로</a></span>
  </div>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
